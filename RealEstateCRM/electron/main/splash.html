<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hashmi Real Estate Builders</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#fff;
      background:radial-gradient(circle at 20% 10%, rgba(56,189,248,.35), transparent 55%),
                 radial-gradient(circle at 80% 80%, rgba(99,102,241,.35), transparent 55%),
                 linear-gradient(135deg,#0f172a 0%,#1e3a8a 60%,#1d4ed8 100%);}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
    .logo-card{background:#fff;border-radius:18px;padding:8px;box-shadow:0 25px 60px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3)}
    .logo-card img{display:block;height:80px;width:80px;border-radius:12px;object-fit:cover}
    h1{margin-top:18px;font-size:18px;font-weight:700;letter-spacing:-.01em}
    .sub{margin-top:4px;font-size:12px;color:rgba(219,234,254,.85)}
    .bar{margin-top:26px;height:3px;width:220px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;position:relative}
    .bar::after{content:"";position:absolute;left:-40%;top:0;bottom:0;width:40%;background:#fff;border-radius:99px;animation:slide 1.4s ease-in-out infinite}
    @keyframes slide{0%{left:-40%}100%{left:100%}}
    .meta{margin-top:18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(191,219,254,.7)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-card">
      <img src="../resources/logo.jpeg" alt="Hashmi Real Estate Builders" />
    </div>
    <h1>Hashmi Real Estate Builders</h1>
    <div class="sub">Enterprise CRM · Desktop Edition</div>
    <div class="bar"></div>
    <div class="meta">Loading services...</div>
  </div>
</body>
</html>
